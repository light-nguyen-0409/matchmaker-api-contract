openapi: 3.0.3
info:
  title: MatchMaker API Contract for CRS Integration
  version: 0.2.0
  description: |
    API contract used by CRS to integrate with MatchMaker/Epsilon. The
    inventory is split between calls made through EpsilonApi and calls made by
    the Bespoke/non-Epsilon direct integration path.
    This specification is derived from the current CRS integration and requires
    MatchMaker validation before being treated as the official external contract.
    The official Epsilon Swagger source is version 2.0.1.0 and publishes 274
    paths; this file intentionally covers the CRS integration inventory rather
    than mirroring the complete Epsilon catalog.
    CRS always uses Basic authentication and may additionally send one or more
    conditional user-auth headers when the corresponding token is available.
  contact:
    name: CRS / MatchMaker integration team
  license:
    name: Internal integration contract
  x-official-epsilon-source:
    swagger_ui: https://support.matchmakersoftware.com:31006/help/index#
    discovery_document: https://support.matchmakersoftware.com:31006/docs/2.0.1.0/swagger
    swagger_version: 2.0.1.0
    path_count: 274
    checked_at: '2026-10-06'
  x-crs-adapter-split:
    Epsilon:
      implementation: App\Externals\EpsilonApi
      binding: App\Contracts\Externals\MatchMakerApiInterface
      endpoint_ids: [MM-R01, MM-R02, MM-R03, MM-R05, MM-R06, MM-R07, MM-R08, MM-R09, MM-R10, MM-R11, MM-R12, MM-W02, MM-W03, MM-W04, MM-W05, MM-W06, MM-W07, MM-W08, MM-W09, MM-W10, MM-W11, MM-W12, MM-W13, MM-F02, MM-F04, MM-F06, MM-F08, MM-F09, MM-D01, MM-D02, MM-D03, MM-D04, MM-D05]
    Bespoke / non-Epsilon:
      implementation: MatchMakerService direct Guzzle and App\Externals\BespokeMatchMaker
      endpoint_ids: [MM-R04, MM-R13, MM-W01, MM-F01, MM-F03, MM-F05, MM-F07, MM-F10]
servers:
  - url: https://{host}
    description: MatchMaker environment host
    variables:
      host:
        default: support.matchmakersoftware.com:31006
        description: Official MatchMaker/Epsilon host over HTTPS; replace for another GAP environment.
tags:
  - name: Epsilon
    description: Calls made through the Epsilon adapter or reserved Epsilon methods.
  - name: Bespoke / non-Epsilon
    description: Calls made directly by the CRS Bespoke/legacy integration path.
  - name: Authentication
    description: Authentication and token endpoints.
  - name: Health
    description: Connectivity and health endpoints.
  - name: Candidate read
    description: Candidate data and inbound synchronization endpoints.
  - name: Candidate registration
    description: Candidate registration endpoints.
  - name: Candidate update
    description: Candidate profile and history update endpoints.
  - name: Compliance and files
    description: Compliance, contact log and file endpoints.
  - name: Reserved
    description: Defined in CRS but not currently called at runtime.
security:
  - basicAuth: []
  - basicAuth: []
    masterUserAuth: []
  - basicAuth: []
    clientUserAuth: []
  - basicAuth: []
    candidateUserAuth: []
paths:
  /api/Accounts/GetAccessToken:
    get:
      tags: [Epsilon, Authentication]
      summary: Get the Epsilon master token
      operationId: getAccessToken
      x-crs-integration-status: active
      description: CRS caches usr_token per MatchMaker database source.
      responses:
        '200':
          description: Master token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterTokenResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/General/Ping:
    get:
      tags: [Epsilon, Health]
      summary: Check MatchMaker availability
      operationId: ping
      x-crs-integration-status: active
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Onboarding/CheckForDuplicate:
    get:
      tags: [Epsilon, Candidate read]
      summary: Check an existing candidate by peo_no
      operationId: checkDuplicateByPeoNo
      x-crs-integration-status: active
      parameters:
        - $ref: '#/components/parameters/PeoNoQuery'
      responses:
        '200':
          description: Candidate is not duplicated, or the response body is ProfileExists.
          content:
            text/plain:
              schema:
                type: string
              examples:
                profileExists:
                  value: ProfileExists
        '409':
          description: Candidate already exists.
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/CheckForDuplicate:
    get:
      tags: ['Bespoke / non-Epsilon', Candidate read]
      summary: Check duplicate candidate data
      operationId: checkDuplicateCandidate
      x-crs-integration-status: active
      x-crs-adapter: 'Bespoke / non-Epsilon'
      x-official-epsilon-path: null
      parameters:
        - name: peo_email
          in: query
          required: true
          schema:
            type: string
        - name: peo_forename
          in: query
          required: true
          schema:
            type: string
        - name: peo_surname
          in: query
          required: true
          schema:
            type: string
        - name: peo_other_tel
          in: query
          required: true
          schema:
            type: string
        - name: peo_postcode
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/GetDetails:
    get:
      tags: [Epsilon, Candidate read]
      summary: Get candidate details
      operationId: getCandidateDetails
      x-crs-integration-status: active
      description: Candidate context is supplied through authentication headers.
      responses:
        '200':
          description: Candidate details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDetails'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/GetPicture:
    get:
      tags: [Epsilon, Candidate read]
      summary: Get a candidate profile picture
      operationId: getCandidatePicture
      x-crs-integration-status: active
      description: The response body is base64 image data without a JSON wrapper.
      responses:
        '200':
          description: Base64 encoded image.
          content:
            text/plain:
              schema:
                type: string
                format: byte
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/GetCareer:
    get:
      tags: [Epsilon, Candidate read]
      summary: Get candidate career history
      operationId: getCandidateCareer
      x-crs-integration-status: active
      responses:
        '200':
          description: Candidate career history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareerResponse'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/GetEducation:
    get:
      tags: [Epsilon, Candidate read]
      summary: Get candidate education history
      operationId: getCandidateEducation
      x-crs-integration-status: active
      responses:
        '200':
          description: Candidate education history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Education'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/GetCandidatesByStatusDate:
    get:
      tags: [Epsilon, Candidate read]
      summary: Get candidate status changes by date
      operationId: getCandidatesByStatusDate
      x-crs-integration-status: active
      parameters:
        - name: dt
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/DateOnly'
      responses:
        '200':
          description: Candidate status changes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StatusChange'
        default:
          $ref: '#/components/responses/Error'

  /api/General/GetMarketingUpdates:
    get:
      tags: [Epsilon, Candidate read]
      summary: Get marketing preference updates
      operationId: getMarketingUpdates
      x-crs-integration-status: active
      parameters:
        - name: sinceDate
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/DateOnly'
      responses:
        '200':
          description: Marketing preference updates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketingUpdate'
        default:
          $ref: '#/components/responses/Error'

  /api/General/GetCandsOnPlan:
    get:
      tags: [Epsilon, Candidate read]
      summary: Get candidates on plan by start date
      operationId: getCandidatesOnPlan
      x-crs-integration-status: active
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/DateOnly'
      responses:
        '200':
          description: Candidates on plan.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OnPlanItem'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Epsilon, Candidate read]
      summary: Filter a batch of candidates by on-plan status
      operationId: filterCandidatesOnPlan
      x-crs-integration-status: active
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/DateOnly'
        - name: endDate
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/DateOnly'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeoNoList'
      responses:
        '200':
          description: The peo_no values that are on plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnknownArray'
        default:
          $ref: '#/components/responses/Error'

  /api/General/GetClassAndCodes/3:
    get:
      tags: ['Bespoke / non-Epsilon', Candidate read]
      summary: Get skill master data
      operationId: getSkillMasterData
      x-crs-integration-status: active
      x-crs-adapter: 'Bespoke / non-Epsilon'
      x-official-epsilon-path: /api/General/GetClassAndCodes/{id}
      responses:
        '200':
          description: MatchMaker skill master data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillMasterData'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/RegisterCandidate:
    post:
      tags: ['Bespoke / non-Epsilon', Candidate registration]
      summary: Register a standard or Permanent candidate
      operationId: registerCandidate
      x-crs-integration-status: active
      x-crs-adapter: 'Bespoke / non-Epsilon'
      x-official-epsilon-path: /api/Onboarding/RegisterCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/RegisterCandidateStandard'
                - $ref: '#/components/schemas/RegisterCandidatePermanent'
      responses:
        '200':
          description: Candidate registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterCandidateResponse'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          description: Candidate is duplicated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnknownObject'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/UpdateCandidateMain:
    put:
      tags: [Epsilon, Candidate update]
      summary: Update candidate profile or mark candidate Live
      operationId: updateCandidateMain
      x-crs-integration-status: active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/CandidateMainUpdate'
                - $ref: '#/components/schemas/CandidateLiveUpdate'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '204':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/UpdatePaymentDetails:
    put:
      tags: [Epsilon, Candidate update]
      summary: Update candidate payment details
      operationId: updatePaymentDetails
      x-crs-integration-status: active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentDetails'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '204':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/UpdateBankDetails:
    post:
      tags: [Epsilon, Candidate update]
      summary: Update candidate bank details directly
      operationId: updateBankDetails
      x-crs-integration-status: active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankDetails'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '204':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/UpdateSource:
    post:
      tags: [Epsilon, Candidate update]
      summary: Update candidate recruitment source
      operationId: updateCandidateSource
      x-crs-integration-status: active
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyArray'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '204':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/AddCandidateCodes:
    post:
      tags: [Epsilon, Candidate update]
      summary: Add candidate skill codes
      operationId: addCandidateCodes
      x-crs-integration-status: active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillCodes'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '204':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/SavePenPicture:
    put:
      tags: [Epsilon, Candidate update]
      summary: Save candidate pen picture
      operationId: savePenPicture
      x-crs-integration-status: active
      parameters:
        - name: pen_picture
          in: query
          required: true
          schema:
            type: string
            maxLength: 1500
          description: CRS strips apostrophes, URL-encodes and limits the value to 1500 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyArray'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '204':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/UpdateCandidateStarterDeclaration:
    put:
      tags: [Epsilon, Candidate update]
      summary: Update candidate starter declaration
      operationId: updateCandidateStarterDeclaration
      x-crs-integration-status: active
      parameters:
        - name: starterDeclaration
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyArray'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '204':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/UpdateCandidateConsultant:
    put:
      tags: [Epsilon, Candidate update]
      summary: Update candidate consultant
      operationId: updateCandidateConsultant
      x-crs-integration-status: active
      parameters:
        - name: conInitials
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyArray'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '204':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/DeleteCandidateCareer:
    delete:
      tags: [Epsilon, Candidate update]
      summary: Delete a candidate career
      operationId: deleteCandidateCareer
      x-crs-integration-status: active
      parameters:
        - name: emp_no
          in: query
          required: true
          schema:
            type: string
          description: Career ID. Source element type is not enforced by CRS.
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '204':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/AddCandidateCareer:
    post:
      tags: [Epsilon, Candidate update]
      summary: Add a candidate career
      operationId: addCandidateCareer
      x-crs-integration-status: active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CareerInput'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '204':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/DeleteCandidateEducation:
    delete:
      tags: [Epsilon, Candidate update]
      summary: Delete a candidate education record
      operationId: deleteCandidateEducation
      x-crs-integration-status: active
      parameters:
        - name: edu_no
          in: query
          required: true
          schema:
            type: string
          description: Education ID. Source element type is not enforced by CRS.
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '204':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/AddCandidateEducation:
    post:
      tags: [Epsilon, Candidate update]
      summary: Add a candidate education record
      operationId: addCandidateEducation
      x-crs-integration-status: active
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EducationInput'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '204':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/SavePictureString/{peo_no}:
    post:
      tags: ['Bespoke / non-Epsilon', Compliance and files]
      summary: Save a standard candidate profile picture
      operationId: saveStandardCandidatePicture
      x-crs-integration-status: active
      x-crs-adapter: 'Bespoke / non-Epsilon'
      x-official-epsilon-path: /api/Candidates/SavePictureString
      parameters:
        - $ref: '#/components/parameters/PeoNoPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PictureString'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Onboarding/SavePictureString/{peo_no}:
    post:
      tags: [Epsilon, Compliance and files]
      summary: Save an existing candidate profile picture
      operationId: saveOnboardingCandidatePicture
      x-crs-integration-status: active
      parameters:
        - $ref: '#/components/parameters/PeoNoPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PictureString'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '204':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Compliance/UploadAnswer/{peo_no}:
    post:
      tags: ['Bespoke / non-Epsilon', Compliance and files]
      summary: Upload a standard candidate RTW answer
      operationId: uploadStandardRightToWorkAnswer
      x-crs-integration-status: active
      x-crs-adapter: 'Bespoke / non-Epsilon'
      x-official-epsilon-path: null
      parameters:
        - $ref: '#/components/parameters/PeoNoPath'
        - $ref: '#/components/parameters/CheckNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RightToWorkAnswer'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Onboarding/UploadAnswer/{peo_no}:
    post:
      tags: [Epsilon, Compliance and files]
      summary: Upload an existing candidate RTW answer
      operationId: uploadOnboardingRightToWorkAnswer
      x-crs-integration-status: active
      parameters:
        - $ref: '#/components/parameters/PeoNoPath'
        - $ref: '#/components/parameters/CheckNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RightToWorkAnswer'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '204':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Compliance/UploadAttachment/{peo_no}:
    post:
      tags: ['Bespoke / non-Epsilon', Compliance and files]
      summary: Upload a standard candidate RTW attachment
      operationId: uploadStandardRightToWorkAttachment
      x-crs-integration-status: active
      x-crs-adapter: 'Bespoke / non-Epsilon'
      x-official-epsilon-path: null
      parameters:
        - $ref: '#/components/parameters/PeoNoPath'
        - $ref: '#/components/parameters/CheckNumber'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SingleFileUpload'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Onboarding/UploadAttachment/{peo_no}:
    post:
      tags: [Epsilon, Compliance and files]
      summary: Upload an existing candidate RTW attachment
      operationId: uploadOnboardingRightToWorkAttachment
      x-crs-integration-status: active
      parameters:
        - $ref: '#/components/parameters/PeoNoPath'
        - $ref: '#/components/parameters/CheckNumber'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SingleFileUpload'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        '204':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/AddToContactLog:
    post:
      tags: ['Bespoke / non-Epsilon', Compliance and files]
      summary: Add a standard candidate contact log
      operationId: addStandardCandidateContactLog
      x-crs-integration-status: active
      x-crs-adapter: 'Bespoke / non-Epsilon'
      x-official-epsilon-path: /api/Candidates/AddContactLog
      parameters:
        - $ref: '#/components/parameters/PeoNoQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactLogRequest'
      responses:
        '200':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Onboarding/AddToContactLog:
    post:
      tags: [Epsilon, Compliance and files]
      summary: Add an onboarding contact log
      operationId: addOnboardingContactLog
      x-crs-integration-status: active
      parameters:
        - $ref: '#/components/parameters/PeoNoQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactLogRequest'
      responses:
        '200':
          description: Contact log number returned as the raw response body.
          content:
            text/plain:
              schema:
                type: string
        '204':
          $ref: '#/components/responses/EmptySuccess'
        default:
          $ref: '#/components/responses/Error'

  /api/Candidates/UploadAttachment:
    post:
      tags: [Epsilon, Compliance and files]
      summary: Attach a file to a contact log
      operationId: uploadContactLogAttachment
      x-crs-integration-status: active
      x-crs-adapter: Epsilon
      x-official-epsilon-path: /api/Candidates/UploadAttachment/{id}
      parameters:
        - name: AttachRef
          in: header
          required: true
          schema:
            type: string
          description: Contact log number.
        - name: AttachType
