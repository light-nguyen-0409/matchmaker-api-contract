components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    epsilonApiKey:
      type: apiKey
      in: header
      name: apiKey
      description: Published by the official Epsilon Swagger; not sent by the current CRS adapter.
    masterUserAuth:
      type: apiKey
      in: header
      name: MasterUserAuth
      description: >-
        Conditional CRS master/session authentication header. The wire value is
        a base64-encoded peo_no:usr_token pair after GetAccessToken succeeds or
        a cached master token is available.
    clientUserAuth:
      type: apiKey
      in: header
      name: CliUserAuth
      description: >-
        Conditional client session authentication header. The wire value is a
        base64-encoded peo_no:usr_token pair after ClientLoginPost. No current
        CRS runtime caller was found.
    candidateUserAuth:
      type: apiKey
      in: header
      name: CanUserAuth
      description: >-
        Conditional candidate session authentication header. The wire value is
        a base64-encoded peo_no:usr_token pair after CandidateLoginPost. No
        current CRS runtime caller was found.

  parameters:
    PeoNoPath:
      name: peo_no
      in: path
      required: true
      schema:
        type: string
    PeoNoQuery:
      name: peo_no
      in: query
      required: true
      schema:
        type: string
    CheckNumber:
      name: chk_no
      in: query
      required: true
      schema:
        type: string
        example: '1'
    EpsilonPlatform:
      name: platform
      in: query
      required: true
      schema:
        type: string
        enum: [Epsilon]

  responses:
    EmptySuccess:
      description: Successful response. CRS does not parse the response body.
    Error:
      description: Error response. The current CRS integration does not enforce a common error schema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnknownObject'
        text/plain:
          schema:
            type: string

  schemas:
    Unknown:
      description: Value whose external schema is not known to the current CRS integration.
    UnknownObject:
      type: object
      additionalProperties: true
    UnknownArray:
      type: array
      items: {}
    EmptyArray:
      type: array
      items: {}
      maxItems: 0
    DateOnly:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      example: '2026-10-02'
    DateTime:
      type: string
      description: Date/time string produced by the current integration.
      example: '2026-10-02T12:30:00'
    MasterTokenResponse:
      type: object
      required: [usr_token]
      properties:
        usr_token:
          type: string
        usr_token_expiry:
          type: string
          format: date-time
          description: Published by Epsilon UserToken; CRS currently caches usr_token.
    RegisterCandidateResponse:
      type: object
      required: [peo_no]
      properties:
        peo_no:
          type: string
    CandidateDetails:
      type: object
      properties:
        peo_no: { type: string }
        peo_title: { type: string }
        peo_forename: { type: string }
        peo_surname: { type: string }
        peo_establish: { type: string }
        peo_town: { type: string }
        peo_county: { type: string }
        peo_postcode: { type: string }
        peo_country: { type: string }
        peo_date_birth: { $ref: '#/components/schemas/DateTime' }
        peo_other_tel: { type: string }
        peo_email: { type: string }
        peo_status: { type: string }
        peo_status_date: { $ref: '#/components/schemas/DateTime' }
        peo_nationality: { type: string }
    Career:
      type: object
      properties:
        emp_no: {}
        emp_cli_name: { type: string }
        emp_job_title: { type: string }
        emp_responsibilities: { type: string }
        emp_from: { type: string }
        emp_to: { type: string }
    CareerResponse:
      type: object
      required: [careers]
      properties:
        careers:
          type: array
          items:
            $ref: '#/components/schemas/Career'
    Education:
      type: object
      properties:
        edu_no: {}
